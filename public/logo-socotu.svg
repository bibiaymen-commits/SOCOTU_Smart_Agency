<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 135" width="100%" height="100%">
  <!-- Main Blue Circle -->
  <circle cx="60" cy="48" r="44" fill="#009fe3" />

  <!-- Top Slit: from right boundary to center -->
